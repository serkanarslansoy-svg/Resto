<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172C2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RESTO">
<title>RESTO · Palatino</title>
<!-- @build:fonts (tools/build.py inlines assets/fonts/fonts.css here) -->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
/* ===== Tuscan Modernist — reconciled tokens (prose palette wins over generated tokens) ===== */
:root{
  --canvas:#F6F2E9; --raised:#FFFFFF; --sunk:#EFEADF;
  --bosco:#172C2A; --bosco-2:#203A38; --bosco-tint:rgba(23,44,42,.08);
  --terra:#BD704E; --terra-ink:#904C2D; --terra-tint:rgba(189,112,78,.12);
  --stone:#D8D1C3; --stone-2:#E8E3D8;
  --ink:#232723; --ink-2:#55574F; --muted:#8C867A;
  --ok:#2F6B4F; --ok-tint:rgba(47,107,79,.12);
  --err:#B3261E; --err-tint:rgba(179,38,30,.10);
  --warn:#9A6A12; --warn-tint:rgba(196,140,30,.16);
  --serif:"Newsreader",Georgia,serif; --sans:"Plus Jakarta Sans",system-ui,sans-serif;
  --r-sm:2px; --r:4px; --r-lg:8px; --r-xl:12px;
  --sh2:0 8px 24px -4px rgba(23,44,42,.10); --sh3:0 12px 32px -6px rgba(23,44,42,.16);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.ms{font-size:20px;width:1em;height:1em;fill:currentColor;flex:none;display:inline-block;vertical-align:-.18em}
svg.ms{width:1em!important;height:1em!important}
.ms.f{font-variation-settings:"FILL" 1,"wght" 400,"opsz" 24}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.h-display{font-family:var(--serif);font-weight:400;font-size:2.1rem;line-height:1.15;letter-spacing:-.015em}
.h1{font-family:var(--serif);font-weight:500;font-size:1.65rem;line-height:1.2;letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.25}
.t-lg{font-weight:600;font-size:1.05rem;line-height:1.35}
.t-sm{font-weight:600;font-size:.875rem}
.body-md{font-size:.875rem;color:var(--ink-2)}
.label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.label.terra{color:var(--terra-ink)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.pad{padding:16px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}
hr.hair{border:0;border-top:1px solid var(--stone);margin:12px 0}

/* surfaces */
.card{background:var(--raised);border:1px solid var(--stone);border-radius:var(--r-lg);padding:16px}
.card.flat{background:var(--sunk);border-color:transparent}
.card.dark{background:var(--bosco);border-color:var(--bosco);color:#EAF0EE}
.card.dark .label{color:#A9BDB9}
.card.terra{background:var(--terra-tint);border-color:transparent}
.list>*+*{border-top:1px solid var(--stone)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);font-weight:600;font-size:.92rem;border:1px solid transparent;transition:background .15s,transform .05s;user-select:none}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--bosco);color:#fff}.btn.primary:hover{background:var(--bosco-2)}
.btn.secondary{background:var(--canvas);border-color:var(--stone);color:var(--ink)}
.btn.ghost{color:var(--ink)}
.btn.accent{background:#9E5536;color:#fff}
.btn.danger{background:var(--raised);border-color:var(--stone);color:var(--err)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:.84rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--terra-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--ink)}
.iconbtn.dark{background:var(--bosco);color:#fff}
.iconbtn.line{border:1px solid var(--stone);background:var(--raised)}

/* chips / tags (2px radius per system) */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:var(--r-sm);font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.bosco{background:var(--bosco-tint);color:var(--bosco)}
.tag.terra{background:var(--terra-tint);color:var(--terra-ink)}
.tag.stone{background:var(--stone);color:var(--ink)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}
.tag.err{background:var(--err-tint);color:var(--err)}
.tag.warn{background:var(--warn-tint);color:var(--warn)}
.tag.solid{background:var(--bosco);color:#fff}
.tag .ms{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--stone);background:var(--raised);font-size:.85rem;font-weight:500;white-space:nowrap}
.chip.on{background:var(--bosco);border-color:var(--bosco);color:#fff}
.chip[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--terra)}
.dot.ok{background:var(--ok)}.dot.bosco{background:var(--bosco)}.dot.err{background:var(--err)}.dot.stone{background:var(--stone)}
.badge{position:absolute;top:-4px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--terra);color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--canvas)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.input,textarea.input,select.input{width:100%;min-height:44px;border:1px solid var(--stone);background:var(--raised);border-radius:var(--r);padding:10px 12px;outline:none}
.input:focus{border-color:var(--bosco);box-shadow:inset 0 0 0 .5px var(--bosco)}
.input::placeholder{color:var(--muted)}
textarea.input{min-height:84px;resize:vertical}
.err-msg{color:var(--err);font-size:.8rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--stone);border-radius:var(--r);background:var(--raised)}
.stepper button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.radio{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:1px solid var(--stone);border-radius:var(--r);background:var(--raised);width:100%;text-align:left}
.radio.on{border-color:var(--bosco);box-shadow:inset 0 0 0 1px var(--bosco)}
.radio .rb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-2);display:flex;align-items:center;justify-content:center}
.radio.on .rb::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bosco)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--stone);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--bosco)}.switch.on::after{left:21px}
.check{width:20px;height:20px;border:1.5px solid var(--ink-2);border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--bosco);border-color:var(--bosco);color:#fff}

/* ===== phone shell (guest + staff) ===== */
.phone{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--canvas);position:relative}
@media(min-width:600px){.phone{border-left:1px solid var(--stone);border-right:1px solid var(--stone)}}
.gh{position:sticky;top:0;z-index:20;background:rgba(246,242,233,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--stone-2);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.gh .top{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:var(--r);background:var(--bosco);color:#F6F2E9;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.25rem;flex:none}
.rname{font-weight:600;font-size:.82rem;line-height:1.1}
.stitle{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:var(--sunk);border-radius:var(--r);padding:2px}
.lang button{height:30px;min-width:30px;padding:0 6px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:var(--r-sm)}
.lang button.on{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--stone)}
.sess{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.main{flex:1;padding:16px 16px 24px}
.foot{position:sticky;bottom:0;z-index:20}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--raised);border-top:1px solid var(--stone);padding-bottom:var(--safe-b)}
.tabbar button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:500;color:var(--ink-2)}
.tabbar button .ms{font-size:24px;position:relative;overflow:visible;width:auto}
.tabbar button.on{color:var(--bosco);font-weight:700}
.tabbar button.on .ms{font-variation-settings:"FILL" 1,"wght" 500,"opsz" 24}
.tabbar .ic{position:relative}
.cartbar{margin:0 12px 10px;background:var(--bosco);color:#fff;border-radius:var(--r-lg);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;box-shadow:var(--sh3);width:calc(100% - 24px);text-align:left}
.offline{background:var(--err);color:#fff;font-size:.8rem;padding:8px 16px;display:flex;align-items:center;gap:8px}

/* hero (no photography — illustrated portico pattern) */
.hero{border-radius:var(--r-lg);overflow:hidden;position:relative;color:#F6F2E9;background:
  radial-gradient(120% 90% at 85% 0%,rgba(189,112,78,.55),transparent 55%),
  linear-gradient(160deg,color-mix(in srgb,var(--bosco) 82%,#fff) 0%,var(--bosco) 60%,color-mix(in srgb,var(--bosco) 65%,#000) 100%);padding:20px 18px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.hero svg.portico{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.hero>*{position:relative}
.thumb{width:76px;height:76px;border-radius:var(--r);flex:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.thumb .ms{font-size:34px;width:auto}
.thumb.lg{width:100%;height:190px;border-radius:var(--r-lg)}
.thumb.lg .ms{font-size:72px}
.c-anti{background:linear-gradient(145deg,#EADFC9,#DCCBAA);color:#7A4A2B}
.c-primi{background:linear-gradient(145deg,#F1DFC0,#E3C38F);color:#8A4E22}
.c-secondi{background:linear-gradient(145deg,#E6D0C2,#C99A80);color:#6E3418}
.c-pizze{background:linear-gradient(145deg,#F2D6C4,#D99A78);color:#7E3519}
.c-dolci{background:linear-gradient(145deg,#EFE4D2,#D9C4A0);color:#6A4A2A}
.c-vini{background:linear-gradient(145deg,#D9C7CC,#9C6B74);color:#4A1E28}
.c-bevande{background:linear-gradient(145deg,#DDE5E1,#B4CBC8);color:#21403C}
.soldout{filter:grayscale(1);opacity:.7}

.dish{display:flex;gap:12px;padding:14px 0}
.dish .nm{font-weight:600;font-size:.98rem;line-height:1.3}
.dish .ds{font-size:.82rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 4px}
.sec-title .h1::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--terra);margin-right:10px;vertical-align:middle}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
.step{text-align:center;font-size:.68rem;color:#8FA6A2}
.step .b{width:36px;height:36px;margin:0 auto 6px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.step.done{color:#EAF0EE}.step.done .b{background:#EAF0EE;color:var(--bosco)}
.step.cur{color:#fff;font-weight:700}.step.cur .b{background:var(--terra);border-color:var(--terra);color:#fff}

.tile{background:var(--raised);border:1px solid var(--stone);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:118px}
.tile .ib{width:40px;height:40px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--bosco)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(15,30,29,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--canvas);width:100%;max-width:520px;max-height:90dvh;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 16px calc(20px + var(--safe-b));box-shadow:var(--sh3);animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--stone);margin:6px auto 12px}
@media(min-width:900px){.scrim{align-items:center}.sheet{border-radius:var(--r-xl)}}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r-lg);font-size:.88rem;z-index:80;display:flex;gap:8px;align-items:center;box-shadow:var(--sh3);max-width:calc(100vw - 32px);animation:up .2s}
@keyframes up{from{transform:translate(var(--tx,0),16px);opacity:0}to{transform:translate(var(--tx,0),0);opacity:1}}
.toast{--tx:-50%}
@keyframes fade{from{opacity:0}to{opacity:1}}
.view{animation:fade .18s}

/* ===== desktop shell (admin + saas) ===== */
.desk{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}
.side{background:var(--bosco);color:#D9E3E1;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
.side .brand .logo{background:#F6F2E9;color:var(--bosco)}
.side a.nav{display:flex;gap:12px;align-items:center;padding:0 12px;height:42px;border-radius:var(--r);text-decoration:none;font-size:.9rem;color:#C6D3D0}
.side a.nav:hover{background:rgba(255,255,255,.05)}
.side a.nav.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.side .sp{flex:1}
.desk>div{min-width:0}
.dmain{padding:28px 32px 48px;min-width:0}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi .v{font-family:var(--serif);font-size:2rem;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
table.tbl{width:100%;border-collapse:collapse;background:var(--raised);border:1px solid var(--stone);border-radius:var(--r-lg);overflow:hidden}
.tbl th{text-align:left;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--stone);background:var(--sunk)}
.tbl td{padding:0 14px;height:52px;border-bottom:1px solid var(--stone-2);font-size:.88rem;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td .t-sm{white-space:nowrap}
.tbl tr.click:hover td{background:rgba(23,44,42,.025);cursor:pointer}
.tblwrap{overflow-x:auto;border-radius:var(--r-lg)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.mobtabs{display:none}
@media(max-width:900px){
  .desk{grid-template-columns:1fr}
  .side{display:none}
  .mobtabs{display:flex;gap:6px;overflow-x:auto;background:var(--bosco);padding:10px 12px;position:sticky;top:0;z-index:20;scrollbar-width:none}
  .mobtabs a{color:#C6D3D0;text-decoration:none;font-size:.82rem;padding:8px 12px;border-radius:var(--r);white-space:nowrap;display:flex;gap:6px;align-items:center}
  .mobtabs a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  .dmain{padding:18px 16px 40px}
  .kpis{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
}

/* chart */
.chart{position:relative;height:200px;display:flex;align-items:flex-end;gap:10px;padding:0 4px 0 34px;border-bottom:1px solid var(--ink-2)}
.chart .gl{position:absolute;left:34px;right:0;border-top:1px solid var(--stone-2)}
.chart .gl span{position:absolute;left:-34px;top:-8px;font-size:.7rem;color:var(--muted);width:28px;text-align:right}
.chart .bw{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;cursor:default}
.chart .bar{width:100%;background:var(--bosco);border-radius:4px 4px 0 0;min-height:2px;transition:opacity .1s}
.chart .bw:hover .bar{opacity:.8}
.chart .gap{width:14px;flex:none}
.xlab{display:flex;gap:10px;padding:6px 4px 0 34px;font-size:.72rem;color:var(--muted)}
.xlab span{flex:1;text-align:center}.xlab .gap{width:14px;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.78rem;padding:6px 9px;border-radius:var(--r);white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

/* ===== KDS (dark, kitchen lighting) ===== */
.kds{min-height:100dvh;background:#0F1A19;color:#E4ECEA;display:flex;flex-direction:column}
.kbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#14231F;border-bottom:1px solid #22342F;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.kseg{display:flex;background:#0F1A19;border-radius:var(--r);padding:3px;gap:2px}
.kseg button{height:38px;padding:0 14px;border-radius:var(--r-sm);color:#9DB2AE;font-weight:600;font-size:.85rem}
.kseg button.on{background:#E4ECEA;color:#0F1A19}
.kcols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px;flex:1;align-items:start}
.kcol h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#9DB2AE;font-weight:600;display:flex;justify-content:space-between;margin:0 2px 10px}
.tk{background:#1A2B28;border:1px solid #2A3E3A;border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.tk .th{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#22362F}
.tk.warn .th{background:#5A4413}.tk.late .th{background:#6B2A1E}
.tk .tb{padding:6px 12px 12px}
.tk .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #2A3E3A;font-size:.95rem}
.tk .it:last-child{border-bottom:0}
.tk .q{font-weight:700;color:#F1B08F;min-width:26px;font-variant-numeric:tabular-nums}
.tk .nt{color:#F1B08F;font-size:.82rem;font-style:italic;margin-top:2px}
.tk .al{display:flex;gap:6px;align-items:center;background:rgba(229,115,80,.16);color:#F7B9A2;border-radius:var(--r);padding:6px 8px;font-size:.8rem;margin-top:8px}
.kbtn{width:100%;min-height:48px;border-radius:var(--r);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px}

function dishMatches(d) {
  const q = ui.q.trim().toLowerCase();
  if (q && !(d.name.toLowerCase().includes(q) || d.d.join(" ").toLowerCase().includes(q))) return false;
  if (ui.diet.veg && !d.tags.includes("veg")) return false;
  if (ui.diet.gf && !(d.tags.includes("gf") || d.opt === "imp")) return false;
  return true;
}

/* ============================================================
   SPLITTING THE BILL (shared by guest bill and staff pre-bill)
   ============================================================ */
const splitState = t => S.splits[t] || (S.splits[t] = { mode: "single", parts: 2, paid: [] });
const staffNames = () => S.staff.map(x => x.name).concat(["Sala"]);
function payers(t) {
  const out = []; const sn = staffNames();
  tOrders(t).forEach(o => { if (!sn.includes(o.by) && !out.includes(o.by)) out.push(o.by); });
  if (S.session.table === t && !S.session.closed) [S.session.joined ? S.session.name : null, ...S.session.others].forEach(n => { if (n && !out.includes(n)) out.push(n); });
  return out;
}
function shares(t) {
  const sp = splitState(t); const c = x => Math.round(x * 100);
  const tot = tableSum(t) + coperto(t);
  const even = (cents, n) => Array.from({ length: n }, (_, k) => (Math.floor(cents / n) + (k < cents - Math.floor(cents / n) * n ? 1 : 0)) / 100);
  if (sp.mode === "equal") return even(c(tot), sp.parts).map((a, k) => ({ key: "p" + k, label: L("Quota", "Share", "Pay") + " " + (k + 1), amount: a }));
  const ps = payers(t);
  if (sp.mode === "person" && ps.length >= 2) {
    const own = {}; ps.forEach(p => own[p] = { amt: 0, lines: [] }); let shared = coperto(t);

  wlOk: () => { const n = val("wn"), p = val("wp"); if (!n || p.replace(/\D/g, "").length < 8) return toast(L("Nome e telefono richiesti", "Name and phone required", "Ad ve telefon gerekli")); S.waitlist.push({ id: uid(), name: n, phone: p, pax: ui.res.pax, date: ui.res.date, service: ui.res.service, ts: now() }); ui.sheet = null; save(); toast(L("Sei in lista d'attesa", "You're on the waitlist", "Bekleme listesine eklendiniz")); },
  ics: v => { const r = S.reservations.find(y => y.code === v); const [hh, mm] = r.time.split(":"); const d = r.date.replace(/-/g, ""); const end = String(+hh + 2).padStart(2, "0");
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//RESTO//Palatino//IT", "BEGIN:VEVENT", "UID:" + r.code + "@resto", "DTSTART:" + d + "T" + hh + mm + "00", "DTEND:" + d + "T" + end + mm + "00", "SUMMARY:" + R.full + " · " + r.pax + " pers.", "LOCATION:" + R.address, "DESCRIPTION:#" + r.code, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = r.code + ".ics"; a.click(); },
  /* staff */
  reqAck: v => { const r = S.requests.find(x => x.id === v); r.status = "ack"; r.by = me()?.name || "Sala"; r.ackAt = now(); commit(); },
  reqDone: v => { const r = S.requests.find(x => x.id === v); r.status = "done"; r.doneAt = now(); if (!r.ackAt) r.ackAt = r.doneAt; commit(); },
  serve: v => { const [oid, u] = v.split("|"); const i = S.orders.find(o => o.id === oid).items.find(x => x.uid === u); i.status = "served"; commit(); },
  serveAll: v => { tOrders(v).forEach(o => o.items.forEach(i => { if (i.status === "ready") i.status = "served"; })); commit(); },
  folio: v => { ui.sheet = { k: "folio", v }; render(); },
  paid: v => { tOrders(v).forEach(o => o.closed = true); S.requests.forEach(r => { if (r.table === v) r.status = "done"; }); Object.assign(table(v), { state: "free", guests: 0, openedAt: null }); delete S.splits[v]; if (S.session.table === v && S.session.joined) { S.session.closed = true; S.session.draft = []; } ui.sheet = null; save(); toast(L("Tavolo chiuso", "Table closed", "Masa kapatıldı")); },
  seatSheet: v => { ui.sheet = { k: "seat", v, n: Math.min(2, table(v).seats) }; render(); },
  seatN: v => { ui.sheet.n = Math.max(1, Math.min(12, ui.sheet.n + +v)); render(); },
  seat: v => { Object.assign(table(v), { state: "seated", guests: ui.sheet.n, openedAt: now() }); ui.sheet = null; commit(); },
  staffDay: v => { ui.staffResDay = +v; render(); },
  seatRes: v => { ui.sheet = { k: "seatRes", v }; render(); },
  seatResTo: v => { const [c, t] = v.split("|"); const r = S.reservations.find(x => x.code === c); r.status = "seated"; r.table = t; Object.assign(table(t), { state: "seated", guests: r.pax, openedAt: now() }); ui.sheet = null; commit(); },
  /* kitchen */
  kst: v => { ui.kSt = v; ui.kSeen = null; render(); },
  kDrawer: () => { ui.sheet = { k: "kDrawer" }; render(); },
  bump: v => { const [oid, st, to] = v.split("|"); const o = S.orders.find(x => x.id === oid); o.items.forEach(i => { if (i.st === st && !i.held && i.status !== "served") { i.status = to; if (to === "cooking" && !i.startedAt) i.startedAt = now(); if (to === "ready") i.readyAt = now(); } }); commit(); },
  avail: v => { const d = dish(v); d.avail = !d.avail; commit(); },
  /* admin */
  admCat: v => { ui.admCat = v; render(); },
  editDish: v => { const d = v ? JSON.parse(JSON.stringify(dish(v))) : { id: "x" + uid(), cat: "primi", st: "cucina", name: "", price: 0, alg: [], tags: [], d: ["", "", ""], avail: true }; ui.sheet = { k: "dish", d, isNew: !v }; render(); },
  edAlg: v => { const d = ui.sheet.d; keepEd(); d.alg = d.alg.includes(v) ? d.alg.filter(x => x !== v) : [...d.alg, v]; render(); },
  edAvail: () => { keepEd(); ui.sheet.d.avail = !ui.sheet.d.avail; render(); },
  edSave: () => { keepEd(); const d = ui.sheet.d; if (!d.name || !(d.price > 0)) { const e = $("#ed-err"); if (e) e.hidden = false; return; } const i = S.menu.findIndex(x => x.id === d.id); if (i >= 0) S.menu[i] = d; else S.menu.push(d); ui.sheet = null; save(); toast(L("Piatto salvato", "Dish saved", "Ürün kaydedildi")); },
  seats: v => { const [id, d] = v.split("|"); const t = table(id); t.seats = Math.max(1, Math.min(12, t.seats + +d)); commit(); },
  addTable: v => { const p = v === "sala" ? "T" : "D"; let n = 1; while (table(p + n)) n++; S.tables.push({ id: p + n, area: v, seats: 4, state: "free", guests: 0, openedAt: null }); commit(); },
  qr: v => { ui.sheet = { k: "qr", v }; render(); },
  admDay: v => { ui.admResDay = +v; render(); },
  shift: v => { const s = S.staff.find(x => x.id === v); s.on = !s.on; commit(); },
  addStaff: () => { ui.sheet = { k: "addStaff" }; render(); },
  addStaffOk: () => { const n = val("sn"); if (!n) return; S.staff.push({ id: uid(), name: n, role: val("sr"), area: "—", on: true }); ui.sheet = null; commit(); },
  cop: v => { S.settings.coperto = Math.max(0, S.settings.coperto + +v); commit(); },
  slang: v => { S.settings.langs[v] = !S.settings.langs[v]; commit(); },

  tStatus: v => { const [id, s] = v.split("|"); S.tenants.find(t => t.id === id).status = s; commit(); },
  closeTicket: v => { S.tickets.find(t => t.id === v).st = "closed"; commit(); },
  obset: v => { const [k, x] = v.split("|"); ui.onb.d[k] = x; render(); },
  obStep: v => { ui.onb.step = Math.max(0, Math.min(4, ui.onb.step + +v)); ui.onbErr = false; render(); },
  obCreate: () => { const d = ui.onb.d; if (!d.name || !d.city) { ui.onbErr = true; return render(); } const id = "t" + uid(); S.tenants.push({ id, name: d.name, city: d.city, plan: d.plan, status: "onboarding", tables: +d.tables || 0, since: iso(0).slice(0, 7), demo: true }); ui.onb = { step: 0, d: { plan: "pro", menu: "tpl" } }; save(); go("#/saas/tenant/" + id); toast(L("Locale creato", "Tenant created", "İşletme oluşturuldu")); }
};
Object.assign(A, {
  /* sign-in */
  pickStaff: v => { ui.login.who = v || null; ui.login.pin = ""; ui.login.err = false; render(); },
  pin: v => {
    const lg = ui.login; if (!lg || !lg.who) return;
    if (v === "del") { lg.pin = lg.pin.slice(0, -1); lg.err = false; return render(); }
    if (lg.pin.length >= 4) return; lg.pin += v; lg.err = false;
    if (lg.pin.length === 4) {
      const who = S.staff.find(x => x.id === lg.who);
      if (who.pin !== lg.pin) { lg.err = true; lg.pin = ""; return render(); }
      ui.auth.staff = who.id; saveAuth(); ui.login = null;
      const started = !who.on; who.on = true; save();
      const dest = ui.after && ui.after.startsWith("#/" + lg.ctx) ? ui.after : lg.ctx === "staff" ? "#/staff/tables" : "#/kitchen/board";
      ui.after = null; go(dest);
      if (started) setTimeout(() => toast(L("Turno iniziato alle", "Shift started at", "Vardiya başladı:") + " " + hm(now())), 30);
      return;
    }
    render();
  },
  lock: () => { ui.auth.staff = null; saveAuth(); ui.sheet = null; ui.login = null; render(true); },
  endShift: () => { const m = me(); if (m) m.on = false; ui.auth.staff = null; saveAuth(); ui.sheet = null; ui.login = null; save(); render(true); toast(L("Turno chiuso", "Shift ended", "Vardiya bitti")); },
  pwToggle: v => { const e = document.getElementById(v); if (e) e.type = e.type === "password" ? "text" : "password"; },
  aFill: () => { $("#ae").value = DEMO.admin[0]; $("#ap").value = S.adminPw; },
  aLogin: () => {
    const em = val("ae").toLowerCase(), pw = $("#ap") ? $("#ap").value : ""; ui.aEmail = em;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) ui.aErr = L("Inserisci un'e-mail valida", "Enter a valid e-mail", "Geçerli bir e-posta girin");
    else if (em !== DEMO.admin[0] || pw !== S.adminPw) ui.aErr = L("E-mail o password non corretti", "Wrong e-mail or password", "E-posta veya şifre hatalı");
    else { ui.aErr = null; ui.auth.admin = true; saveAuth(); const d = ui.after && ui.after.startsWith("#/admin/") && !/login|forgot|reset/.test(ui.after) ? ui.after : "#/admin/dash"; ui.after = null; return go(d); }
    render();
  },
  fSend: () => { const em = val("fe"); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { ui.fErr = true; return render(); } ui.fErr = false; ui.fSent = em; render(); },
  fResend: () => toast(L("Link inviato di nuovo", "Link sent again", "Bağlantı tekrar gönderildi")),
  rSave: () => {
    const a = ui.rPw || "", b = $("#r2") ? $("#r2").value : "";
    if (a.length < 8 || !/\d/.test(a) || !/[A-Z]/.test(a)) ui.rErr = L("La password non rispetta i requisiti", "Password doesn't meet the rules", "Şifre kurallara uymuyor");
    else if (a !== b) ui.rErr = L("Le password non coincidono", "Passwords don't match", "Şifreler eşleşmiyor");
    else { S.adminPw = a; save(); ui.rErr = null; ui.rPw = ""; ui.fSent = null; go("#/admin/login"); return setTimeout(() => toast(L("Password aggiornata", "Password updated", "Şifre güncellendi")), 30); }
    render();
  },
  pFill: () => { $("#pe").value = DEMO.saas[0]; $("#pp").value = DEMO.saas[1]; },
  pLogin: () => {
    if ((ui.pStage || "pw") === "pw") {
      if (val("pe").toLowerCase() === DEMO.saas[0] && $("#pp").value === DEMO.saas[1]) { ui.pStage = "2fa"; ui.pErr = null; }
      else ui.pErr = L("Credenziali non valide", "Invalid credentials", "Geçersiz bilgiler");
      return render();
    }
    if (val("p2") === DEMO.saas[2]) { ui.auth.saas = true; saveAuth(); ui.pStage = "pw"; ui.pErr = null; const d = ui.after && ui.after.startsWith("#/saas/") ? ui.after : "#/saas/overview"; ui.after = null; return go(d); }
    ui.pErr = L("Codice errato", "Wrong code", "Kod hatalı"); render();
  },
  pBack: () => { ui.pStage = "pw"; ui.pErr = null; render(); },
  logout: v => { if (v === "admin") ui.auth.admin = false; else ui.auth.saas = false; saveAuth(); go("#/" + v + "/" + (v === "admin" ? "login" : "overview")); },
  /* manual ticket */
  soCat: v => { ui.so.cat = v; render(); },
  soAdd: v => { const d = dish(v); if (!d || !d.avail) return; const opt = d.opt ? OPTS[d.opt][0][0] : null; const ex = ui.so.items.find(i => i.dishId === v && i.opt === opt && !i.note); if (ex) ex.qty++; else ui.so.items.push({ uid: uid(), dishId: v, qty: 1, opt, note: "", st: d.st, course: COURSE[d.cat] }); render(); },
  soQ: v => { const [u, d] = v.split("|"); const i = ui.so.items.find(x => x.uid === u); i.qty += +d; if (i.qty < 1) ui.so.items = ui.so.items.filter(x => x !== i); render(); },
  soOpt: v => { const i = ui.so.items.find(x => x.uid === v); const os = OPTS[dish(i.dishId).opt]; i.opt = os[(os.findIndex(o => o[0] === i.opt) + 1) % os.length][0]; render(); },
  soCourse: v => { const [u, c] = v.split("|"); ui.so.items.find(x => x.uid === u).course = +c; render(); },
  soNote: v => { ui.sheet = { k: "soNote", v }; render(); },
  soNoteAdd: v => { const e = $("#son"); if (e) e.value = (e.value ? e.value + ", " : "") + v; },
  soNoteOk: v => { ui.so.items.find(x => x.uid === v).note = val("son"); ui.sheet = null; render(); },
  soHold: () => { ui.so.hold = !ui.so.hold; render(); },
  soSend: () => {
    const so = ui.so; if (!so.items.length) return;
    const food = so.items.filter(i => i.course > 0).map(i => i.course); const first = food.length ? Math.min(...food) : 0;
    const o = { id: uid(), no: ++S.seq, table: so.table, by: me()?.name || "Sala", ts: now(), note: "", items: so.items.map(i => ({ ...i, status: "new", held: so.hold && i.course > first })) };
    S.orders.push(o); ui.so = null; save(); go("#/staff/table/" + o.table);
    setTimeout(() => toast(L("Comanda", "Ticket", "Fiş") + " #" + o.no + " · " + L("inviata", "sent", "gönderildi")), 30);
  },
  fire: v => { const [t, c] = v.split("|"); tOrders(t).forEach(o => o.items.forEach(i => { if (i.held && i.course === +c) { i.held = false; i.firedAt = now(); } })); save(); toast(courseName(+c) + " · " + L("marcia!", "fired!", "başlatıldı")); },
  /* brand, floor plan, tablet */
  poster: v => { ui.sheet = { k: "poster", v }; render(); },
  cat: v => { ui.openCats.has(v) ? ui.openCats.delete(v) : ui.openCats.add(v); render(); },
  zoom: v => { ui.sheet = { k: "zoom", v, x: false }; render(); },
  zoomX: () => { ui.sheet.x = !ui.sheet.x; render(); },
  zoomAdd: v => { const d = dish(v); ui.sheet = null; if (!S.session.joined) return go("#/guest/join"); addDraft(v); toast(d.name + " · " + L("aggiunto", "added", "eklendi")); },
  dview: v => { ui.dview = v; render(); const m = document.querySelector(".media"); if (m) m.scrollIntoView({ block: "nearest", behavior: "smooth" }); },
  openX: v => { ui.dviewNext = "x"; ui.dish = null; go("#/guest/dish/" + v); },
  edXDel: () => { keepEd(); delete ui.sheet.d.explode; render(); },
  edImgDel: () => { keepEd(); delete ui.sheet.d.img; render(); },
  brandLogoDel: () => { S.brand.logo = null; commit(); },
  brandColor: v => { S.brand.primary = v; commit(); },
  selT: v => { ui.selT = v; render(); },
  shape: v => { const [id, k] = v.split("|"); const t = table(id); const p = tpos(t); t.x = p.x; t.y = p.y; t.shape = k; commit(); },
  /* kitchen + reports */
  kSound: () => { ui.kSound = !ui.kSound; if (ui.kSound) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} beep(); } render(); },
  kAllDay: () => { ui.sheet = { k: "allday" }; render(); },
  rep: v => { ui.rep = +v; render(); },
  csv: () => {
    const rows = [["ticket", "table", "by", "time", "dish", "qty", "unit_eur", "station", "status"]];
    S.orders.forEach(o => o.items.forEach(i => rows.push([o.no, o.table, o.by, hm(o.ts), dish(i.dishId)?.name, i.qty, unit(i).toFixed(2), i.st, ist(i)])));
    const csv = rows.map(r => r.map(x => `"${String(x ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" })); a.download = "palatino-" + iso(0) + ".csv"; a.click();
  },
  /* split */
  splitMode: v => { const [t, m] = v.split("|"); const sp = splitState(t); sp.mode = m; sp.paid = []; commit(); },
  splitN: v => { const [t, d] = v.split("|"); const sp = splitState(t); sp.parts = Math.max(2, Math.min(12, sp.parts + +d)); sp.paid = []; commit(); },
  payShare: v => { const [t, k] = v.split("|"); const sp = splitState(t); sp.paid = sp.paid.includes(k) ? sp.paid.filter(x => x !== k) : [...sp.paid, k]; commit(); }
});
function keepEd() { const d = ui.sheet.d; if (!$("#ed-name")) return; d.name = val("ed-name"); d.price = parseFloat(val("ed-price").replace(",", ".")) || 0; if ($("#ed-bottle")) { d.bottle = parseFloat(val("ed-bottle").replace(",", ".")) || 0; if (d.bottle) d.opt = "vino"; else { delete d.bottle; if (d.opt === "vino") delete d.opt; } } d.cat = val("ed-cat"); d.st = val("ed-st"); d.d = [val("ed-d0"), val("ed-d1"), val("ed-d2")]; }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a],[data-go],a[href^='#/']");
  if (!el) return;
  if (el.classList.contains("scrim") && e.target !== el) return; // click inside the sheet body
  e.preventDefault();
  if (el.dataset.a) { const f = A[el.dataset.a]; if (f) f(el.dataset.v); }
  else go(el.dataset.go || el.getAttribute("href"));
});
document.addEventListener("input", e => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === "q") { ui.q = e.target.value; render(); }
  else if (k === "soq") { ui.so.q = e.target.value; render(); }
  else if (k === "r1") { ui.rPw = e.target.value; render(); }
  else if (k === "tagline") { S.brand.tagline = e.target.value; save(); }
  else if (k.startsWith("ob.")) ui.onb.d[k.slice(3)] = e.target.value;
  else if (k === "rname") ui.res.name = e.target.value;
  else if (k === "rphone") ui.res.phone = e.target.value;
  else if (k === "rnotes") ui.res.notes = e.target.value;
});
document.addEventListener("change", e => {
  const k = e.target.dataset.ch; if (!k) return;
  if (k === "resSt") { S.reservations.find(r => r.code === e.target.dataset.v).status = e.target.value; commit(); toast(L("Stato aggiornato", "Status updated", "Durum güncellendi")); }
  if (k === "edX" && e.target.files[0]) { keepEd(); readImg(e.target.files[0], 900, "image/jpeg", u => { ui.sheet.d.explode = u; render(); toast(L("Esploso caricato", "Exploded view added", "Patlatılmış görsel eklendi")); }); }
  if (k === "edImg" && e.target.files[0]) { keepEd(); readImg(e.target.files[0], 640, "image/jpeg", u => { ui.sheet.d.img = u; render(); }); }
  if (k === "brandLogo" && e.target.files[0]) readImg(e.target.files[0], 256, "image/png", u => { S.brand.logo = u; if (save()) { render(); toast(L("Logo aggiornato", "Logo updated", "Logo güncellendi")); } else S.brand.logo = null; });
  if (k === "plan") { S.tenants.find(t => t.id === e.target.dataset.v).plan = e.target.value; commit(); }
});
document.addEventListener("keydown", e => {
  const dn = e.target.closest && e.target.closest("[data-drag]");
  if (dn && e.key.startsWith("Arrow")) { e.preventDefault(); const t = table(dn.dataset.drag); const p = tpos(t); const cl = v => Math.max(6, Math.min(94, v)); t.x = cl(p.x + (e.key === "ArrowRight" ? 2 : e.key === "ArrowLeft" ? -2 : 0)); t.y = cl(p.y + (e.key === "ArrowDown" ? 2 : e.key === "ArrowUp" ? -2 : 0)); ui.edT = t.id; commit(); return; } if (e.key === "Escape" && ui.sheet) { ui.sheet = null; render(); } if (e.key === "Enter" && e.target.id === "jname") A.join();
  if (e.key === "Enter" && ["ae", "ap"].includes(e.target.id)) A.aLogin();
  if (e.key === "Enter" && ["pe", "pp", "p2"].includes(e.target.id)) A.pLogin();
  if (document.querySelector("[data-a=pin]") && !/INPUT|TEXTAREA/.test(e.target.tagName)) { if (/^\d$/.test(e.key)) A.pin(e.key); else if (e.key === "Backspace") A.pin("del"); }
});
let drag = null;
document.addEventListener("pointerdown", e => {
  const n = e.target.closest("[data-drag]"); if (!n) return;
  drag = { n, plan: n.closest(".plan"), id: n.dataset.drag, moved: false }; ui.edT = drag.id;
  try { n.setPointerCapture(e.pointerId); } catch (err) {} n.focus(); e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!drag) return; const r = drag.plan.getBoundingClientRect(); const cl = v => Math.max(6, Math.min(94, Math.round(v / 2) * 2));
  drag.x = cl((e.clientX - r.left) / r.width * 100); drag.y = cl((e.clientY - r.top) / r.height * 100);
  drag.n.style.left = drag.x + "%"; drag.n.style.top = drag.y + "%"; drag.moved = true;
});
document.addEventListener("pointerup", () => {
  if (!drag) return; const t = table(drag.id);
  if (drag.moved) { t.x = drag.x; t.y = drag.y; } else { const p = tpos(t); t.x = p.x; t.y = p.y; }
  drag = null; commit();
});
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (route().role === "staff") render(); }, 150); });
window.addEventListener("online", () => render()); window.addEventListener("offline", () => render());
setInterval(() => { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; if (ui.sheet) return; const r = route().role; if (["kitchen", "staff", "guest", "admin"].includes(r)) render(); }, 20000);
render(true);
